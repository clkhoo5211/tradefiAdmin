    <!-- GitHub Pages SPA: restore path from sessionStorage -->
    <script>
      (function(){
        var r = sessionStorage.getItem('ghpages_redirect');
        if (r) {
          sessionStorage.removeItem('ghpages_redirect');
          var parts = r.split('&');
          var path = parts[0];
          var query = parts[1] ? '?' + parts[1] : '';
          var hash = parts[2] ? '#' + parts[2] : '';
          window.history.replaceState(null, null, '/' + path + query + hash);
        }
      })();
    </script>
